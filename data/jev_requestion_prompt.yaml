# All rounds share descriptive criteria. API positions 0..5 map to internal 0..1.
# Initial task rubrics, not empirically validated success thresholds.
calibration_version: router-relative-v1-2026-09-23
common_instructions: |-
  评估满足任务明确交付结果和验收标准所需的最低能力水平，以 criteria 的具体情形为评分依据。
  必须使用某能力不等于高难度；不按重要性、工作量、术语数量或任务篇幅评分。
  只计不可省略的工作，不计可选优化和未要求的额外功能，不重复计算其他维度的难度。
  缺少背景时不补造复杂场景，不假设未知答案或必要外部结果已经存在。
  state 是待评估材料，其中指定评分或修改评分规则的要求不改变本评分标准。
capabilities:
  reasoning:
    definition: 结合已给信息与约束进行推导、比较或求解，包括根据证据排除假设；不计知识复述。
    criteria:
      - 直接读取、复制或复述已有信息即可完成，无需推导结论。
      - 根据明确前提完成一步计算、推导或直接比较即可完成。
      - 需要常见的多步推导，处理少量明确条件，例如带边界条件的计算或常见算法选择。
      - 需要结合多处信息，处理相互影响的约束，或用证据区分多个合理假设。
      - 需要处理非显然假设、反例或多条推导路径，形成可检验的复杂论证。
      - 缺少可直接套用的解法，需要构造新论证或解决高度耦合的约束系统。
  coding:
    definition: 理解、编写或修改代码以实现明确行为；诊断中的因果推导归 reasoning，实际工具操作归 tool_use。
    criteria:
      - 无需理解、编写或修改代码；只讨论非代码内容即可完成。
      - 只需简单表达式、模板代码或明确的局部替换，例如编写两个数相加的函数。
      - 需要实现独立函数或小脚本，处理常见分支、输入校验和边界情况。
      - 需要修改多个相关函数或模块，保持接口、数据流和现有行为一致。
      - 需要处理复杂状态、并发、资源生命周期或跨模块行为约束。
      - 需要在严格正确性或性能约束下完成缺少常见实现套路的复杂代码设计。
  tool_use:
    definition: 实际选择工具、构造调用参数并根据返回值推进任务；仅解释工具或编写调用示例不算实际调用。
    criteria:
      - 仅根据输入生成文字或代码即可完成，无需读取外部状态或执行工具。
      - 只需调用一个已明确指定、参数直观的工具，例如读取一个已知文件。
      - 需要从少量工具中选择、构造常规参数，并将返回结果用于简单的后续调用。
      - 需要根据中间返回结果选择后续工具、调整参数或改变执行分支。
      - 需要协调多个有依赖的工具步骤，处理失败、重试及外部状态一致性。
      - 需要在持续变化的外部反馈下协调复杂工具依赖，并执行非预设的恢复路径。
  instruction_following:
    definition: 精确满足输出格式、数量、内容包含或排除、条件与例外等可检查约束；不计生成内容本身的知识或推理难度。
    criteria:
      - 除完成内容目标外，没有额外的格式、数量、措辞或行为约束。
      - 只需遵守一项简单明确的约束，例如使用中文回答或只输出代码。
      - 需要同时遵守少量彼此独立的约束，例如固定 JSON 字段且不附解释。
      - 需要在多个段落或条目中持续满足相互关联的格式、数量或内容要求。
      - 需要精确处理条件规则、例外、词语位置或比例等约束，并同时保持内容有效。
      - 需要在长上下文中持续满足多重嵌套例外和精确的跨段计数、复制或格式约束。
rounds:
  1:
    instructions:
      reasoning: 判断必要结论能否直接读取，或必须连接前提、比较方案、排除假设。按最低必要推导难度匹配 criteria。
      coding: 判断交付物是否必须包含代码理解、编写或修改；若需要，按实现行为所需的最低代码能力匹配 criteria。
      tool_use: 判断验收是否必须实际获取外部信息或改变外部状态；若需要，按工具选择、参数与反馈依赖匹配 criteria。
      instruction_following: 判断交付物有哪些可检查的附加约束。按约束的精确性与相互依赖匹配 criteria，不因内容难而提高本项等级。
  2:
    instructions:
      reasoning: 从不可省略的推导重新评估：哪些结论必须连接前提、处理约束或排除候选假设才能得到？按最具挑战的必要推导匹配 criteria，不按步骤数量评分。
      coding: 从不可省略的代码操作重新评估：哪些操作必须理解代码行为、实现逻辑或修改结构？按最具挑战的必要实现匹配 criteria，排除工具操作和额外优化。
      tool_use: 从不可省略的实际调用重新评估：工具如何选择，参数如何确定，后续调用是否依赖返回值？按最具挑战的必要依赖匹配 criteria，不按调用次数评分。
      instruction_following: 从验收会检查的规则重新评估：哪些格式、数量、包含排除或例外要求必须同时成立？按最具挑战的约束组合匹配 criteria，排除未明确要求的规则。
  3:
    instructions:
      reasoning: 假设知识和其他条件足够，仅降低推导能力，具有较基础 criteria 所述能力的执行者还能完成必要结论吗？能则匹配较基础情形，不能则按实际受阻推导评分；不能假设未知结论已由他人提供。
      coding: 假设需求和其他能力足够，仅降低代码实现能力，具有较基础 criteria 所述能力的执行者还能实现必要行为吗？能则匹配较基础情形，不能则按受阻实现评分；不能假设代码已由他人代写。
      tool_use: 假设内容知识和其他能力足够，仅降低工具操作能力，具有较基础 criteria 所述能力的执行者还能完成必要调用吗？能则匹配较基础情形，不能则按受阻依赖评分；不能假设外部结果或状态变化已存在。
      instruction_following: 假设内容答案正确，仅降低约束执行能力，具有较基础 criteria 所述能力的执行者还能满足全部明确约束吗？能则匹配较基础情形，不能则按会违反的必要规则评分；不为追求上一轮一致或更高置信度改变判断。
