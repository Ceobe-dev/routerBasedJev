# Jev semantic re-question prompts. Each non-empty value replaces the original
# instructions for that capability in the corresponding round. Empty or
# missing capability prompts reuse the original first-round instructions.
# The task is supplied separately in state; no USER_QUERY substitution is needed.
rounds:
  2:
    instructions:
      coding: |-
        仅评估 coding：理解、编写或修改代码以实现指定行为。
        哪些必要步骤要求理解代码行为、实现逻辑或修改代码结构？按这些步骤的能力负荷评分，排除可选实现及排障、工具操作的额外难度。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
      debugging: |-
        仅评估 debugging：依据异常定位代码或软件系统根因，并确定有效修复。
        哪些必要步骤要求解释症状、排除候选根因或验证修复？按诊断负荷评分，不把已知改法的实现工作量算作排障。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
      reasoning: |-
        仅评估 reasoning：结合信息与约束进行推导、比较或求解。
        哪些必要结论无法直接读取，必须连接前提、处理约束或比较方案才能得到？按推导负荷评分，排除知识复述和可选的深入分析。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
      tool_use: |-
        仅评估 tool_use：选择工具、构造调用参数并根据返回结果推进任务。
        哪些必要步骤要求实际调用工具？按工具选择、参数约束和反馈依赖评分，不按调用次数或工具处理内容的难度评分。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
  3:
    instructions:
      coding: |-
        仅评估 coding：理解、编写或修改代码以实现指定行为。
        假设其他能力和条件具备，但缺少上述代码能力，且不能由外部代做，核心目标还能完成吗？能完成则低分；不能则按受阻代码工作所需能力评分，排除其他维度难度。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
      debugging: |-
        仅评估 debugging：依据异常定位代码或软件系统根因，并确定有效修复。
        假设其他能力和条件具备，但不能诊断异常或验证修复，且不能凭空获得未知根因，核心目标还能完成吗？能完成则低分；不能则按受阻诊断所需能力评分。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
      reasoning: |-
        仅评估 reasoning：结合信息与约束进行推导、比较或求解。
        假设知识和其他条件具备，但只能读取信息、执行明确步骤，不能推导或借助外部代为求解，核心目标还能完成吗？能完成则低分；不能则按受阻推导所需能力评分。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
      tool_use: |-
        仅评估 tool_use：选择工具、构造调用参数并根据返回结果推进任务。
        假设其他能力和条件具备，但不能调用工具，也不能凭空获得调用结果或外部状态变化，核心目标还能完成吗？能完成则低分；不能则按受阻操作所需能力评分。
        0=无需，1–2=仅改善质量，3–9=必要能力由基础到极复杂；必要不等于高分。
