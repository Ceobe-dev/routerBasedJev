[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "capability-llm-router"
version = "0.1.0"
description = "Capability-based LLM model router"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_router"]
